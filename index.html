<!DOCTYPE html> 
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAHSRI - Inventory Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

/* ================= LOGIN PAGE ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fff0f5,#ffe4ec);
}

.login-box{
    width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#d63384;
    margin-bottom:8px;
}

.login-title{
    text-align:center;
    margin-bottom:25px;
    color:#555;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.input-group textarea{
    height:80px;
    resize:none;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#d63384;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#b82b70;
}

/* ================= MAIN APP ================= */

#mainApp{
    display:none;
}

header{
    background:#d63384;
    color:white;
    padding:18px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:28px;
    font-weight:bold;
}

.header-buttons button{
    border:none;
    padding:10px 16px;
    margin-left:8px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.cart-btn{
    background:white;
    color:#d63384;
}

/* ================= DASHBOARD ================= */

.dashboard{
    padding:25px 35px;
}

.dashboard h2{
    margin-bottom:18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.stat-box{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stat-box h3{
    color:#777;
    margin-bottom:8px;
}

.stat-box p{
    font-size:28px;
    font-weight:bold;
    color:#d63384;
}

/* ================= SEARCH ================= */

.search-box{
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    position:relative;
}

.product-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:7px;
}

.category{
    color:#777;
    font-size:13px;
}

.price{
    color:#d63384;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.rating{
    margin-bottom:8px;
}

.stock{
    margin:10px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stock-controls button{
    border:none;
    background:#eee;
    padding:5px 9px;
    border-radius:5px;
    cursor:pointer;
}

.add-cart{
    width:100%;
    padding:11px;
    background:#d63384;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.add-cart:hover{
    background:#b82b70;
}

.heart{
    position:absolute;
    right:12px;
    top:12px;
    background:white;
    border:none;
    border-radius:50%;
    width:38px;
    height:38px;
    font-size:20px;
    cursor:pointer;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-content{
    background:white;
    width:90%;
    max-width:650px;
    max-height:85vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    font-size:25px;
    cursor:pointer;
}

/* ================= CART ================= */

.cart-item{
    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.cart-item img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
}

.cart-details{
    flex:1;
}

.quantity button{
    border:none;
    padding:5px 9px;
    cursor:pointer;
}

.remove{
    border:none;
    background:#ffdddd;
    color:red;
    padding:7px;
    border-radius:5px;
    cursor:pointer;
}

.cart-total{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#28a745;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* ================= CHECKOUT ================= */

.checkout-item{
    padding:10px;
    background:#f7f7f7;
    margin-bottom:8px;
    border-radius:8px;
}

.payment{
    margin:15px 0;
}

.payment label{
    display:block;
    margin:10px 0;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    header{
        padding:15px;
    }

    .dashboard{
        padding:20px 15px;
    }

    .login-box{
        width:90%;
    }
}
</style>

let cart=[];


/* ================= LOGIN ================= */

function login(){

    const email=document.getElementById("email").value.trim();
    const phone=document.getElementById("phone").value.trim();
    const address=document.getElementById("address").value.trim();

    if(!email || !email.includes("@")){
        alert("Please enter a valid Email ID.");
        return;
    }

    if(phone.length < 10){
        alert("Please enter a valid Phone Number.");
        return;
    }

    if(address.length < 5){
        alert("Please enter your Address.");
        return;
    }

    document.getElementById("loginPage").style.display="none";
    document.getElementById("mainApp").style.display="block";

    document.getElementById("checkoutEmail").value=email;
    document.getElementById("checkoutPhone").value=phone;
    document.getElementById("checkoutAddress").value=address;

    displayProducts(products);
    updateDashboard();
}


/* ================= PRODUCTS DISPLAY ================= */

function displayProducts(list){

    const container=document.getElementById("products");

    container.innerHTML="";

    document.getElementById("searchResults").innerText=list.length;

    if(list.length===0){

        container.innerHTML=`
        <div style="grid-column:1/-1;text-align:center;padding:50px;">
            <h2>❌ No Products Found</h2>
            <p>Try searching another product.</p>
        </div>
        `;

        return;
    }

    list.forEach((product,index)=>{

        const originalIndex=products.indexOf(product);

        let stars="";

        for(let i=1;i<=5;i++){
            stars += i<=Math.round(product.rating) ? "⭐" : "☆";
        }

        container.innerHTML += `

        <div class="product-card">

            <button class="heart"
                onclick="toggleHeart(this)">
                ♡
            </button>

            <img src="${product.image}"
                 onerror="this.src='https://via.placeholder.com/400x250?text=Product'">

            <div class="product-info">

                <h3>${product.name}</h3>

                <div class="category">
                    ${product.category}
                </div>

                <div class="rating">
                    ${stars}
                    ${product.rating}/5
                </div>

                <div class="price">
                    ₹${product.price.toLocaleString("en-IN")}
                </div>

                <div class="stock">

                    <span>
                        Stock:
                        <strong id="stock-${originalIndex}">
                            ${product.stock}
                        </strong>
                    </span>

                    <div class="stock-controls">

                        <button onclick="changeStock(${originalIndex},-1)">
                            📉 -
                        </button>

                        <button onclick="changeStock(${originalIndex},1)">
                            📈 +
                        </button>

                    </div>

                </div>

                <button class="add-cart"
                    onclick="addToCart(${originalIndex})">

                    🛒 Add to Cart

                </button>

            </div>

        </div>

        `;
    });
}


/* ================= SEARCH ================= */

document.getElementById("search").addEventListener("input",function(){

    const keyword=this.value.toLowerCase().trim();

    const filtered=products.filter(product=>

        product.name.toLowerCase().includes(keyword) ||

        product.category.toLowerCase().includes(keyword)

    );

    displayProducts(filtered);

});


/* ================= CART ================= */

function addToCart(index){

    const product=products[index];

    if(product.stock<=0){
        alert("❌ Product is out of stock.");
        return;
    }

    const existing=cart.find(item=>item.index===index);

    if(existing){

        if(existing.quantity < product.stock){
            existing.quantity++;
        }else{
            alert("Maximum available stock reached.");
            return;
        }

    }else{

        cart.push({
            index:index,
            quantity:1
        });

    }

    updateCartCount();

    alert(product.name+" added to cart! 🛒");
}


function updateCartCount(){

    const count=cart.reduce(
        (sum,item)=>sum+item.quantity,0
    );

    document.getElementById("cartCount").innerText=count;
}


function openCart(){

    displayCart();

    document.getElementById("cartModal").style.display="flex";
}


function displayCart(){

    const container=document.getElementById("cartItems");

    container.innerHTML="";

    if(cart.length===0){

        container.innerHTML=`
        <div style="text-align:center;padding:30px;">
            <h3>🛒 Cart is Empty</h3>
        </div>
        `;

    }

    let total=0;
    let quantity=0;

    cart.forEach(item=>{

        const product=products[item.index];

        total += product.price*item.quantity;
        quantity += item.quantity;

        container.innerHTML += `

        <div class="cart-item">

            <img src="${product.image}">

            <div class="cart-details">

                <strong>${product.name}</strong>

                <p>
                    ₹${product.price.toLocaleString("en-IN")}
                </p>

                <div class="quantity">

                    <button onclick="changeCartQuantity(${item.index},-1)">
                        −
                    </button>

                    ${item.quantity}

                    <button onclick="changeCartQuantity(${item.index},1)">
                        +
                    </button>

                </div>

            </div>

            <button class="remove"
                onclick="removeFromCart(${item.index})">
                🗑️
            </button>

        </div>

        `;

    });

    document.getElementById("cartProducts").innerText=cart.length;
    document.getElementById("cartQuantity").innerText=quantity;
    document.getElementById("cartTotal").innerText=total.toLocaleString("en-IN");
}


function changeCartQuantity(index,change){

    const item=cart.find(i=>i.index===index);

    if(!item)return;

    const newQuantity=item.quantity+change;

    if(newQuantity<=0){

        removeFromCart(index);
        return;

    }

    if(newQuantity>products[index].stock){

        alert("Only "+products[index].stock+" items available.");
        return;

    }

    item.quantity=newQuantity;

    updateCartCount();
    displayCart();
}


function removeFromCart(index){

    cart=cart.filter(item=>item.index!==index);

    updateCartCount();
    displayCart();
}


/* ================= CHECKOUT ================= */

function openCheckout(){

    if(cart.length===0){

        alert("Your cart is empty.");
        return;

    }

    displayCheckoutItems();

    closeModal("cartModal");

    document.getElementById("checkoutModal").style.display="flex";
}


function displayCheckoutItems(){

    const container=document.getElementById("checkoutItems");

    container.innerHTML="";

    let total=0;

    cart.forEach(item=>{

        const product=products[item.index];

        const itemTotal=product.price*item.quantity;

        total+=itemTotal;

        container.innerHTML+=`

        <div class="checkout-item">

            <strong>${product.name}</strong>

            <br>

            Quantity:
            <strong>${item.quantity}</strong>

            <br>

            Price:
            ₹${itemTotal.toLocaleString("en-IN")}

        </div>

        `;

    });

    document.getElementById("checkoutTotal").innerText=
        total.toLocaleString("en-IN");
}


/* ================= PLACE ORDER ================= */

function placeOrder(){

    const email=document.getElementById("checkoutEmail").value.trim();
    const phone=document.getElementById("checkoutPhone").value.trim();
    const address=document.getElementById("checkoutAddress").value.trim();

    if(!email || !email.includes("@")){

        alert("Please enter valid email.");
        return;

    }

    if(phone.length<10){

        alert("Please enter valid phone number.");
        return;

    }

    if(address.length<5){

        alert("Please enter delivery address.");
        return;

    }

    const payment=document.querySelector(
        'input[name="payment"]:checked'
    ).value;

    let orderDetails="";
    let total=0;

    cart.forEach(item=>{

        const product=products[item.index];

        product.stock-=item.quantity;

        total+=product.price*item.quantity;

        orderDetails +=
            `${product.name} × ${item.quantity}\n`;

    });

    alert(
        "🎉 ORDER PLACED SUCCESSFULLY!\n\n"+
        "Products:\n"+
        orderDetails+
        "\nTotal: ₹"+
        total.toLocaleString("en-IN")+
        "\nPayment: "+payment+
        "\n\nThank you for shopping with SAHSRI! 🎀"
    );

    cart=[];

    updateCartCount();
    updateDashboard();

    closeModal("checkoutModal");

    const keyword=document.getElementById("search").value;

    if(keyword){

        document.getElementById("search").dispatchEvent(
            new Event("input")
        );

    }else{

        displayProducts(products);

    }

}


/* ================= STOCK ================= */

function changeStock(index,value){

    products[index].stock += value;

    if(products[index].stock<0){
        products[index].stock=0;
    }

    const stockElement=document.getElementById(
        "stock-"+index
    );

    if(stockElement){
        stockElement.innerText=products[index].stock;
    }

    updateDashboard();
}


function updateDashboard(){

    document.getElementById("totalProducts").innerText=
        products.length;

    const total=products.reduce(
        (sum,p)=>sum+p.stock,0
    );

    document.getElementById("totalStock").innerText=total;
}


/* ================= HEART ================= */

function toggleHeart(button){

    if(button.innerText==="♡"){

        button.innerText="❤️";

    }else{

        button.innerText="♡";

    }

}


/* ================= MODAL ================= */

function closeModal(id){

    document.getElementById(id).style.display="none";

}


/* ================= INITIAL ================= */

updateDashboard();

// Order Place பண்ணும் போது ரன் ஆகும்
function processOrder() {
    let address = document.getElementById("delivery-address").value.trim();
    let selectedPayment = document.querySelector('input[name="payment"]:checked');
    
    if (address === "") {
        alert("Please enter a valid Delivery Address!");
        return;
    }
    if (!selectedPayment) {
        alert("Please select a payment method!");
        return;
    }
    
    alert(`Order Confirmed! \n📍 Address: ${address} \n💳 Payment Method: ${selectedPayment.value}`);
}
